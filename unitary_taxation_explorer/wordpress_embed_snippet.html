<!-- Unitary Taxation Explorer — WordPress embed snippet.
     Paste into a "Custom HTML" block on a normal WordPress page. Ready to use
     as-is: the src points at the hosted app on taxjustice.net (password-gated
     until the embargo lifts on 2 August 2026, 00:00 GMT). The script grows the
     iframe with the app's content, so there is no nested scrollbar. -->
<iframe id="ut-explorer"
        src="https://taxjustice.net/wp-content/uploads/pay-where-you-play/"
        title="Unitary Taxation Explorer"
        style="width:100%;border:0;min-height:80vh;display:block"
        loading="lazy"></iframe>
<script>
  window.addEventListener("message", function (e) {
    if (e.data && e.data.utExplorerHeight) {
      document.getElementById("ut-explorer").style.height =
        (e.data.utExplorerHeight + 20) + "px";
    }
  });
</script>
